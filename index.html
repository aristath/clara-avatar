<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara Avatar</title>
  <style>
    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/doto/Doto-Regular.ttf") format("truetype");
    }

    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/fonts/doto/Doto-SemiBold.ttf") format("truetype");
    }

    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/doto/Doto-Bold.ttf") format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #f2f2f2;
    }

    #app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: #000000;
    }

    #avatar-panel,
    #stream-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #000000;
    }

    #avatar-panel {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #avatar-container {
      position: relative;
      width: 420px;
      height: 420px;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .frame-div {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
    }

    #div-glitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    #stream-panel {
      padding: 20px 22px;
      color: #f0f0f0;
      font-family: "Doto", monospace;
      text-rendering: geometricPrecision;
    }

    #stream-title {
      min-height: 18px;
      margin-bottom: 12px;
      color: #bdbdbd;
      font-size: 14px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #stream-title:empty {
      margin-bottom: 0;
    }

    #stream-text {
      margin: 0;
      max-height: 100%;
      overflow: hidden;
      font: 18px/1.38 "Doto", monospace;
      font-weight: 600;
      letter-spacing: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .token-chat {
      color: #f4f4f4;
    }

    .token-user {
      color: #70e080;
    }

    .token-reasoning {
      color: #8a8a8a;
    }

    .token-task {
      color: #ffbf4d;
    }

    .token-tool,
    .token-status {
      color: #f2e36b;
    }

    @media (max-width: 760px) {
      #app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) minmax(180px, 0.75fr);
      }

      #stream-panel {
        padding: 14px 16px;
      }

      #stream-text {
        font-size: 16px;
        line-height: 1.32;
      }
    }
  </style>
</head>
<body>
  <main id="app-shell">
    <section id="avatar-panel">
      <div id="avatar-container">
        <div class="frame-div" id="div-a"></div>
        <div class="frame-div" id="div-b"></div>
        <div id="div-glitch"></div>
      </div>
    </section>
    <section id="stream-panel" aria-live="polite">
      <div id="stream-title"></div>
      <pre id="stream-text"></pre>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
