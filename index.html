<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara Avatar</title>
  <style>
    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/doto/Doto-Regular.ttf") format("truetype");
    }

    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/fonts/doto/Doto-SemiBold.ttf") format("truetype");
    }

    @font-face {
      font-family: "Doto";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/doto/Doto-Bold.ttf") format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #f2f2f2;
    }

    #app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: #000000;
    }

    #avatar-panel,
    #stream-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #000000;
    }

    #avatar-panel {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #avatar-container {
      position: relative;
      width: 420px;
      height: 420px;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .frame-div {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
    }

    #div-glitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    #stream-panel {
      display: flex;
      flex-direction: column;
      padding: 20px 22px;
      color: #f0f0f0;
      font-family: "Doto", monospace;
      text-rendering: geometricPrecision;
    }

    #stream-title {
      flex: 0 0 auto;
      min-height: 18px;
      margin-bottom: 12px;
      color: #bdbdbd;
      font-size: 14px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #stream-title:empty {
      margin-bottom: 0;
    }

    #stream-text {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      max-height: none;
      overflow: hidden;
      font: 18px/1.38 "Doto", monospace;
      font-weight: 600;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    #stream-text p,
    #stream-text ul,
    #stream-text ol,
    #stream-text blockquote,
    #stream-text pre,
    #stream-text table {
      margin: 0 0 0.72em;
    }

    #stream-text p:last-child,
    #stream-text ul:last-child,
    #stream-text ol:last-child,
    #stream-text blockquote:last-child,
    #stream-text pre:last-child,
    #stream-text table:last-child {
      margin-bottom: 0;
    }

    #stream-text ul,
    #stream-text ol {
      padding-left: 1.3em;
    }

    #stream-text li + li {
      margin-top: 0.16em;
    }

    #stream-text blockquote {
      padding-left: 0.8em;
      border-left: 2px solid currentColor;
      opacity: 0.76;
    }

    #stream-text code,
    #stream-text pre {
      font-family: "Doto", monospace;
      font-weight: 700;
    }

    #stream-text code {
      color: #ffffff;
    }

    #stream-text pre {
      padding: 0.48em 0.62em;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
    }

    #stream-text a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    #stream-text table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
    }

    #stream-text th,
    #stream-text td {
      padding: 0.16em 0.4em 0.16em 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      text-align: left;
      vertical-align: top;
    }

    .token-chat {
      color: #f4f4f4;
    }

    .token + .token {
      margin-top: 0.72em;
    }

    .token-user {
      padding: 0.38em 0.54em;
      background: #ffbf4d;
      color: #000000;
    }

    .token-user code {
      color: #000000;
    }

    .token-user pre {
      background: rgba(0, 0, 0, 0.08);
    }

    .token-user th,
    .token-user td {
      border-bottom-color: rgba(0, 0, 0, 0.28);
    }

    .token-reasoning {
      color: #8a8a8a;
    }

    .token-task {
      color: #ffbf4d;
    }

    .token-tool,
    .token-status {
      color: #f2e36b;
    }

    @media (max-width: 760px) {
      #app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) minmax(180px, 0.75fr);
      }

      #stream-panel {
        padding: 14px 16px;
      }

      #stream-text {
        font-size: 16px;
        line-height: 1.32;
      }
    }
  </style>
</head>
<body>
  <main id="app-shell">
    <section id="avatar-panel">
      <div id="avatar-container">
        <div class="frame-div" id="div-a"></div>
        <div class="frame-div" id="div-b"></div>
        <div id="div-glitch"></div>
      </div>
    </section>
    <section id="stream-panel" aria-live="polite">
      <div id="stream-title"></div>
      <div id="stream-text"></div>
    </section>
  </main>
  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
