<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #avatar-container {
      position: relative;
      width: 420px;
      height: 420px;
      overflow: hidden;
      max-width: 100vw;
      max-height: 100vh;
    }

    .frame-div {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
    }

    #div-glitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 420px;
      height: 420px;
      background-size: auto;
      background-repeat: no-repeat;
      background-position: center 0px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="avatar-container">
    <div class="frame-div" id="div-a"></div>
    <div class="frame-div" id="div-b"></div>
    <div id="div-glitch"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
